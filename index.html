<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Paquinha Hub - Key System</title>
    <style>
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #16161d;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #2a2a35;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        h2 { color: #40c057; margin-bottom: 10px; }
        p { color: #a1a1aa; font-size: 14px; }
        .key-box {
            background: #000000;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            color: #ff922b;
            word-break: break-all;
            margin: 20px 0;
            border: 1px dashed #404050;
            letter-spacing: 1px;
        }
        button {
            background-color: #228be6;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        button:hover { background-color: #1c7ed6; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Paquinha Hub V1</h2>
        <p>Chave de acesso (Muda a cada 1 hora):</p>
        
        <div class="key-box" id="keyDisplay">Carregando...</div>
        
        <button onclick="copiarChave()">Copiar Chave</button>
    </div>

    <script>
        function gerarChave() {
            const d = new Date();
            const horaBlock = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}-${d.getHours()}`;
            
            let seed = 0;
            for (let i = 0; i < horaBlock.length; i++) {
                seed = (seed * 31 + horaBlock.charCodeAt(i)) % 1000000000;
            }

            const caracteres = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            let chave = "";
            for (let i = 0; i < 20; i++) {
                let x = Math.sin(seed++) * 10000;
                let index = Math.floor((x - Math.floor(x)) * caracteres.length);
                chave += caracteres[index];
            }
            return "PAQ-" + chave;
        }

        const chaveAtual = gerarChave();
        document.getElementById("keyDisplay").textContent = chaveAtual;

        function copiarChave() {
            navigator.clipboard.writeText(chaveAtual).then(() => {
                alert("Chave copiada com sucesso!");
            });
        }
    </script>

</body>
</html>
